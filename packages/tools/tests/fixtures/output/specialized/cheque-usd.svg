<svg width="850" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="lines" patternUnits="userSpaceOnUse" width="100%" height="100%">
      <line x1="50" y1="280" x2="800" y2="280" stroke="#ccc" stroke-width="1"/>
    </pattern>
    <linearGradient id="chequeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#chequeGrad)" rx="8" ry="8"/>
  <rect x="2" y="2" width="846" height="396" fill="none" stroke="#dee2e6" stroke-width="2" rx="6" ry="6"/>
  
  <!-- Decorative elements -->
  <rect x="10" y="10" width="830" height="380" fill="none" stroke="#dee2e6" stroke-width="1" stroke-dasharray="5,5" rx="4" ry="4"/>
  
  <!-- Bank Name -->
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">
    Chase Bank
  </text>
  
  <!-- Cheque Number -->
  <text x="800" y="45" font-family="Arial, sans-serif" font-size="14" fill="#212529" text-anchor="end">
    No. 000000
  </text>
  
  <!-- Date -->
  <text x="800" y="80" font-family="Arial, sans-serif" font-size="14" fill="#212529" text-anchor="end">
    Date: 2024-06-15
  </text>
  
  <!-- Pay To Label -->
  <text x="50" y="120" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">
    PAY TO THE ORDER OF
  </text>
  
  <!-- Payee Name -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">
    John Doe
  </text>
  <line x1="50" y1="155" x2="650" y2="155" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Amount Box -->
  <rect x="670" y="105" width="130" height="40" fill="white" stroke="#dee2e6" stroke-width="2" rx="4"/>
  <text x="680" y="133" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">
    $5,000.00
  </text>
  
  <!-- Amount in Words -->
  <text x="50" y="200" font-family="Arial, sans-serif" font-size="14" fill="#212529">
    Five Thousand Dollars Only
  </text>
  <line x1="50" y1="205" x2="800" y2="205" stroke="#dee2e6" stroke-width="1"/>
  <text x="800" y="200" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="end">
    DOLLARS
  </text>
  
  <!-- Memo Line -->
  <text x="50" y="270" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">
    MEMO
  </text>
  <text x="100" y="270" font-family="Arial, sans-serif" font-size="12" fill="#212529">
    Payment for invoice #123
  </text>
  <line x1="50" y1="275" x2="300" y2="275" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Signature Line -->
  <text x="800" y="290" font-family="Arial, sans-serif" font-size="11" fill="#6c757d" text-anchor="end">
    AUTHORIZED SIGNATURE
  </text>
  <line x1="600" y1="275" x2="800" y2="275" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- MICR Line -->
  <text x="50" y="360" font-family="MICR, Courier New, monospace" font-size="14" fill="#212529">
    C000000C A123456789A 0000000000B
  </text>
  
  <!-- Account Number -->
  <text x="50" y="380" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">
    Account: ******0000
  </text>
  
  <!-- Security Features -->
  <text x="800" y="380" font-family="Arial, sans-serif" font-size="8" fill="#adb5bd" text-anchor="end">
    VOID AFTER 90 DAYS
  </text>
</svg>