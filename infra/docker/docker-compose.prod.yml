# ═══════════════════════════════════════════════════════════════
# HSAFX World App — Production Docker Compose (Self-Hosted VPS)
# Decision D-01: Single VPS deployment
#
# Services:
#   - postgres: PostgreSQL 16 database
#   - redis:    Caching + rate limiting + sessions
#   - fastapi:  Python compute backend (4 workers)
#   - rust-engine: Rust text/data engine service
#   - web:      Next.js public app (standalone)
#   - admin:    Next.js admin panel (standalone)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
# Prerequisites: Copy .env.example → .env and fill in all values.
# ═══════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL 16 ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hsafx-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hsafx}
      POSTGRES_USER: ${POSTGRES_USER:-hsafx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hsafx} -d ${POSTGRES_DB:-hsafx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis 7 ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hsafx-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── FastAPI Compute Backend ──────────────────────────────────
  fastapi:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.fastapi
    container_name: hsafx-fastapi
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DEBUG=false
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - HOST=0.0.0.0
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET is required}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-hsafx-uploads}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Rust Engine Service ─────────────────────────────────────
  rust-engine:
    build:
      context: ../../backend/rust
      dockerfile: engine-service/Dockerfile
    container_name: hsafx-rust-engine
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - INTERNAL_API_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET is required}
      - RUST_LOG=warn
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Web App (Next.js) ───────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://hsafx.world}
        - NEXT_PUBLIC_FASTAPI_URL=${NEXT_PUBLIC_FASTAPI_URL:-https://api.hsafx.world}
    container_name: hsafx-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hsafx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hsafx}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - META_CLIENT_ID=${META_CLIENT_ID:-}
      - META_CLIENT_SECRET=${META_CLIENT_SECRET:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://hsafx.world}
      - NEXT_PUBLIC_FASTAPI_URL=${NEXT_PUBLIC_FASTAPI_URL:-https://api.hsafx.world}
      - INTERNAL_API_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required}
      - RUST_ENGINE_URL=http://rust-engine:3001
      - FASTAPI_URL=http://fastapi:8000
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN:-}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi:
        condition: service_healthy
      rust-engine:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Admin Panel (Next.js) ───────────────────────────────────
  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_ADMIN_URL:-https://admin.hsafx.world}
    container_name: hsafx-admin
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hsafx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hsafx}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_ADMIN_URL:-https://admin.hsafx.world}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hsafx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_html:/usr/share/nginx/html
    depends_on:
      - web
      - admin
      - fastapi
      - rust-engine
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_certs:
    driver: local
  nginx_html:
    driver: local
