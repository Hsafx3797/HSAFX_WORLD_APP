# ═══════════════════════════════════════════════════════════════
# HSAFX World App — Nginx Reverse Proxy Configuration
# Routes: hsafx.world → web:3000, admin.hsafx.world → admin:3001
# admin container listens on 3001 internally (Docker network — no host conflict with rust-engine:3001).
# FastAPI + Rust engine are internal only — never exposed directly.
# All /api/v1/ traffic goes through Next.js (auth + billing + dispatch).
# ═══════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Security headers (defense-in-depth, apps also set these)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;  # Disabled — modern browsers' built-in XSS filters can introduce vulnerabilities

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ── Upstream definitions ──────────────────────────────────
    upstream web_backend {
        server web:3000;
    }

    upstream admin_backend {
        server admin:3001;
    }

    # Note: fastapi (port 8000) and rust-engine (port 3001) are internal services.
    # Next.js dispatches to them server-side via FASTAPI_URL / RUST_ENGINE_URL env vars.

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        server_name hsafx.world admin.hsafx.world;

        # ACME challenge for cert renewal
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Web App (hsafx.world) ─────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name hsafx.world;

        ssl_certificate /etc/nginx/certs/hsafx.world.crt;
        ssl_certificate_key /etc/nginx/certs/hsafx.world.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Static assets — long cache
        location /_next/static/ {
            proxy_pass http://web_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # WASM assets
        location /wasm/ {
            proxy_pass http://web_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Type "application/wasm";
        }

        # API v1 — rate-limited, proxied to Next.js which handles auth + billing + dispatch
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE / streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # All other requests → Next.js
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── Admin Panel (admin.hsafx.world) ───────────────────────
    server {
        listen 443 ssl http2;
        server_name admin.hsafx.world;

        ssl_certificate /etc/nginx/certs/admin.hsafx.world.crt;
        ssl_certificate_key /etc/nginx/certs/admin.hsafx.world.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Static assets
        location /_next/static/ {
            proxy_pass http://admin_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # All other requests → Admin Next.js
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
