# ═══════════════════════════════════════════════════════════════
# HSAFX World App — Staging Overlay
# ═══════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hsafx-staging

resources:
  - ../../base

# NOTE: namePrefix removed. The namespace (hsafx-staging) provides sufficient
# isolation. namePrefix caused service routing failures because internal env
# vars like NEXT_PUBLIC_FASTAPI_URL=http://fastapi:8000 referenced the
# original service names, not the prefixed ones.

commonLabels:
  app.kubernetes.io/instance: staging

patches:
  # Scale down for staging
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: admin
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: fastapi
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # Lower resource limits for staging
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 300m
  - target:
      kind: Deployment
      name: fastapi
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m

configMapGenerator:
  - name: hsafx-config
    literals:
      - app-url=https://staging.hsafx.world
      - admin-url=https://staging-admin.hsafx.world
