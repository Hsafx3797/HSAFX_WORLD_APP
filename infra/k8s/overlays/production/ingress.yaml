# ═══════════════════════════════════════════════════════════════
# HSAFX World App — Production Ingress
# Requires: nginx ingress controller + cert-manager
# ═══════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hsafx-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hsafx.world
        - admin.hsafx.world
      secretName: hsafx-tls
  rules:
    # Web app
    - host: hsafx.world
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: fastapi
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    # Admin panel
    - host: admin.hsafx.world
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3001
