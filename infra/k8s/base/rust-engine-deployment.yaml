# ═══════════════════════════════════════════════════════════════
# HSAFX World App — Rust Engine Service Deployment
# ═══════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-engine
  labels:
    app.kubernetes.io/name: rust-engine
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-engine
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: rust-engine
          image: ghcr.io/hsafx/rust-engine:latest
          ports:
            - containerPort: 3001
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3001"
            - name: RUST_LOG
              value: "warn"
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: hsafx-secrets
                  key: internal-secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
