[workspace]
members = ["text-tools"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["HSAFX"]

[workspace.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
regex = "1.10"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1.7", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
getrandom = { version = "0.2", features = ["js"] }
urlencoding = "2.1"
